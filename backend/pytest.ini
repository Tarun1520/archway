# Settings for pytest, the test runner.
#
# How to run every backend test (from the project root):
#   backend/.venv/bin/python -m pytest backend
#
# pythonpath = .   lets tests write `from app...` (the "." is the backend folder)
# testpaths        where pytest looks when you do not name a folder
# asyncio_mode     lets `async def test_...` functions run without extra markers
[pytest]
pythonpath = .
testpaths = tests learning
asyncio_mode = auto
